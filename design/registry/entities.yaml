# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-05"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: is_night
    status: active
    source: design/gdd/game-time-calendar.md
    referenced_by:
      - design/gdd/game-time-calendar.md
    variables:
      - minute_of_day
      - segment_start_clock_night
    output_range: [false, true]
    expression: "minute_of_day >= offset(segment_start_clock_night), offset(c) = (c - 360 + 1440) mod 1440"
    notes: "Consumed by Enemy AI (stronger at night), Drops, Audio, Lighting. Night lasts to 06:00."
    added: 2026-10-25
    revised: 2026-10-26
  - name: sleep_target
    status: active
    source: design/gdd/game-time-calendar.md
    referenced_by:
      - design/gdd/game-time-calendar.md
    variables:
      - day_index
      - minute_of_day
      - earliest_sleep_clock
    output_range: [1440, null]
    expression: "sleep_allowed = minute_of_day >= offset(earliest_sleep_clock); sleep_target = (day_index + 1) * 1440"
    notes: "F6. Always 06:00 of the next day (= next_dawn); minutes_skipped in [1, 720] at defaults. Consumed by Interaction (bed), Save/Load (Sleep slot)."
    added: 2026-10-26
    revised: ""
  - name: defeat_wake_minute
    status: active
    source: design/gdd/game-time-calendar.md
    referenced_by:
      - design/gdd/game-time-calendar.md
    variables:
      - game_minute
      - defeat_time_cost_minutes
      - next_dawn
    output_range: [game_minute, next_dawn - 1]
    expression: "min(game_minute + defeat_time_cost_minutes, next_dawn - 1)"
    notes: "F7. Non-boss defeat only, written via AdvanceBy; never crosses 06:00. Consumed by Defeat & Retry."
    added: 2026-10-26
    revised: ""
  - name: next_occurrence
    status: active
    source: design/gdd/game-time-calendar.md
    referenced_by:
      - design/gdd/game-time-calendar.md
    variables:
      - day_index
      - game_minute
      - days_per_season
      - target_weekday
      - target_season
      - target_day_of_season
      - target_clock
      - include_today
    output_range: [0, 112]
    expression: "F13a next weekday (k <= 7); F13b next season day (k <= 4 * days_per_season); F13c next clock time (within 1440 min)"
    notes: "F13, guarantees Rule 21 (nothing missed forever). output_range is k in DAYS for F13a/F13b only; F13c returns a game_minute within 1440 minutes of now (different unit). F13b returns Unsupported when seasons_enabled=false. Consumed by Dialogue, Quest, Shops, journal (VS)."
    added: 2026-10-26
    revised: 2026-10-26
  - name: buffer_window_membership
    status: active
    source: design/gdd/input.md
    referenced_by:
      - design/gdd/input.md
      - design/gdd/character-controller.md
    variables:
      - action
      - window
      - clock
      - now_real
      - now_game
      - epoch_now
      - buffer_retention
    output_range: [none, one_record]
    expression: "eligible(e) = Pressed and not consumed and e.epoch == epoch_now and (e.action == a or e.baseAction == a) and now_clock - e.t_clock <= window and now_real - e.t_real <= buffer_retention; selected = oldest eligible (min seq)"
    notes: "F1. TryConsume/Peek. Consumers (Character Controller, Fishing) declare window + clock (Real: hit-stop eats the window; Game: hit-stop nearly freezes it). Times are int64 1-us ticks; bounds inclusive. Stamping error <= one frame, always lenient. Character Controller registers Jump 0.12 / DropThrough 0.12 / Attack 0.20 / Dodge 0.15 / Plunge 0.15 s, all Game clock (Rule 28)."
    added: 2026-10-30
    revised: 2026-10-31
  - name: horizontal_reach
    status: active
    source: design/gdd/character-controller.md
    referenced_by:
      - design/gdd/character-controller.md
      - design/gdd/skill-moveset.md
    variables:
      - move_speed
      - T_total
      - n_dodge
      - dodge_duration
      - dodge_distance
    output_range: [0, 12.62]
    expression: "R = move_speed * (T_total - n_d * t_d) + n_d * d_dodge"
    notes: "F3. Base move_speed 6.5. Single jump 5.10 u; jump + dodge at apex 7.90 u; standard chain (jump -> double jump at apex -> air dodge) 11.58 u; skill ceiling 12.62 u. Level-design rule: a required gap <= 0.85 x the reach of the chain it requires (<= 4.3 u jump only; <= 9.8 u with double jump + air dodge); never require coyote. Consumed by level design / map gen, Boss Encounter arenas."
    added: 2026-10-31
    revised: ""
  - name: effective_movement
    status: active
    source: design/gdd/character-controller.md
    referenced_by:
      - design/gdd/character-controller.md
    variables:
      - move_x
      - move_speed
      - speed_modifiers
      - jump_modifiers
      - root
      - attack_move_mult
    output_range: [1.17, 9.75]
    expression: "vx = root ? 0 : move.x * move_speed * clamp(prod(s_i), 0.3, 1.5) * m_ctx; v_jump = root ? 0 : jump_speed * sqrt(clamp(prod(j_i), 0.5, 1.2))"
    notes: "F5. Output range is |vx| in u/s when not rooted. Jump modifiers scale HEIGHT (velocity * sqrt). m_ctx = 0.6 for ground attack / land recovery, 1.0 otherwise, identical for every weapon. Root blocks move/jump/dodge but never attack; root cuts an active dodge (C-10). Speed modifiers never shorten a dodge. Consumed by Elemental & Status (registers modifiers)."
    added: 2026-10-31
    revised: ""

  - name: skill_commit_time
    status: active
    source: design/gdd/skill-moveset.md
    referenced_by:
      - design/gdd/skill-moveset.md
    variables:
      - t_CancelWindow
      - recovery_start
      - default_cancel_lockout
      - timeline_scale
    output_range: [0.0167, 1.2]
    expression: "commit_time = t_CancelWindow (tap branch) | recovery_start + default_cancel_lockout if no CancelWindow | start of dive node; scaled by timeline_scale (slowest of the family band for commit_time_max)"
    notes: "F2. Seconds from skill Start until dodge may cancel. commit_time_max(family) over normal skills feeds Boss Encounter (vulnerability window >= 1.25 x max, concept P2). No cap on normal-attack commit (user decision 2026-11-05, OQ-S10). Fallback ground 0.13, dash 0.18 s."
    added: 2026-11-05
    revised: ""
  - name: skill_lunge_limits
    status: active
    source: design/gdd/skill-moveset.md
    referenced_by:
      - design/gdd/skill-moveset.md
    variables:
      - d_node
      - t_node
      - r_node
      - r_total
      - r_air
      - D_dodge
      - V_dodge
      - move_speed
      - attack_move_mult
    output_range: [0, 6.46]
    expression: "d_node <= r_node*D_dodge; sum(d_node) <= r_total(kind)*D_dodge; d_node/t_node + move_speed*attack_move_mult <= V_dodge; sum airborne-started d_node per airtime <= r_air*D_dodge (air_lunge_budget)"
    notes: "F3, game units (C-12): D_dodge 6.46 u, V_dodge 32.3 u/s. Defaults r_node 0.5 (3.23 u), r_total 0.75 normal (4.85 u) / 1.0 special (6.46 u), r_air 0.5 (3.23 u, refills on Landed/Teleport/Respawn). Lunge is ADDED to player control (never replaces). Adds up to R_skill to Controller horizontal_reach (OQ-S8)."
    added: 2026-11-05
    revised: ""
  - name: skill_launch_speed
    status: active
    source: design/gdd/skill-moveset.md
    referenced_by:
      - design/gdd/skill-moveset.md
    variables:
      - g
      - h_launch
      - r_launch
      - H_jump
    output_range: [0, 30.2]
    expression: "v_launch = sqrt(2*g*h_launch), h_launch <= r_launch*H_jump; only when the node starts grounded"
    notes: "F5, game units: g 72.4 u/s^2, H_jump = jump_apex_height 6.293 u. Launch from ground only (user decision 2026-11-05) so max height stays Controller jump + double jump; no coyote, no apex hang, jump-cut does not affect it."
    added: 2026-11-05
    revised: ""
  - name: special_cooldown_remaining
    status: active
    source: design/gdd/skill-moveset.md
    referenced_by:
      - design/gdd/skill-moveset.md
    variables:
      - cooldown
      - t_now
      - t_active_start
    output_range: [0, 30]
    expression: "remaining = clamp(cooldown - (t_now - t_active_start), 0, cooldown); Game clock"
    notes: "F7. t_active_start = first Hit window opening of the last use. One special at a time (one weapon carried, stones swapped at home only). Saved as remaining; reload sets t_active_start = t_now - (cooldown - remaining). Consumed by HUD (remaining/cooldown), Save/Load."
    added: 2026-11-05
    revised: ""
  - name: skill_timeline_scale
    status: active
    source: design/gdd/skill-moveset.md
    referenced_by:
      - design/gdd/skill-moveset.md
    variables:
      - t
      - timeline_scale
      - scale_band
    output_range: [0.7, 1.3]
    expression: "t' = t * timeline_scale for every node time and duration; clip_speed = 1/timeline_scale; lunge distance unchanged"
    notes: "F9 / Rule 34. Speed axis of the Pillar 2 sidegrade: one XML shared by fast and strong branches. Weapon Tree owns per-branch timeline_scale and per-family scale_band (proposed global 0.7-1.3). Not scaled: hold_max, hold_threshold, link_window, special cooldown. Validator checks bounds at both ends of the family band."
    added: 2026-11-05
    revised: ""

