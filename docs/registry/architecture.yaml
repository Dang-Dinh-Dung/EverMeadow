# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: input_event_processing
    status: active
    api: "InputSettings.updateMode = ProcessEventsManually; FrameDriver calls InputSystem.Update() after FrameClock.Advance"
    not: "ProcessEventsInDynamicUpdate / ProcessEventsInFixedUpdate (dispatch before Update or starved under hit-stop)"
    adr: docs/architecture/adr-0001-input-architecture.md
    reason: "Guarantees clock -> input -> gameplay order inside one frame; presses stamped with the current frame's clock"
    referenced_by:
      - docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
    revised: ""
  - purpose: gameplay_time_unit
    status: active
    api: "long ticks, 1 tick = 1 microsecond, real source Time.unscaledTimeAsDouble clamped monotonic"
    not: "float/double seconds or accumulated float counters"
    adr: docs/architecture/adr-0001-input-architecture.md
    reason: "Exact boundary compares (Input F1) and floor (Input F5); no drift in long sessions"
    referenced_by:
      - docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
    revised: ""
  - purpose: skill_data_format
    status: active
    api: "XML parsed with System.Xml.XmlReader in the noEngineReferences assembly Evermeadow.Core.Skills; loaded once via ISkillTextSource (FolderSkillTextSource reading real .xml files in Assets/StreamingAssets/Skills/)"
    not: "ScriptableObject skills, JSON, XDocument, Addressables as the only source, reading files after boot"
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    reason: "GDD Skill & Moveset Rule 1-3: every skill is an XML file; the core must unit-test outside Unity and allocate nothing at run time"
    referenced_by:
      - docs/architecture/adr-0002-skill-runtime-data-contract.md
      - docs/architecture/adr-0003-skill-authoring-pipeline.md
    added: 2026-11-06
    revised: ""
  - purpose: skill_authoring_export
    status: active
    api: "Skill Tool EditorWindow (GraphView, Editor-only assembly Evermeadow.Presentation.SkillTool.Editor) opens and saves the skill XML in Assets/StreamingAssets/Skills/ directly through SkillFlow + SkillXmlWriter; saves only files SkillXmlReader accepts, only when bytes change; the build check validates the folder and never writes"
    not: "Graph assets kept in the project, the Graph Toolkit package, a second XML writer, a build step that writes XML"
    adr: docs/architecture/adr-0003-skill-authoring-pipeline.md
    reason: "XML must be in git so changing the authoring tool never loses data (GDD Rule 2, 31); a build that rewrote XML would hide drift"
    referenced_by:
      - docs/architecture/adr-0003-skill-authoring-pipeline.md
    added: 2026-11-06
    revised: "2026-11-06"
  - purpose: skill_time_quantization
    status: active
    api: "SkillTime.StepsOf(seconds) = ceil(seconds*60 - 1e-6); SkillTime.TickOfStep(steps) = (steps*Ticks.PerSecond + 59)/60; timeline_scale applied before quantizing"
    not: "Ticks.FromSeconds (rounds to nearest) for skill timestamps; float seconds compares at run time"
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    reason: "Build-time bounds and run-time bounds must agree (GDD Rule 23); 1/60 s is not a whole number of microsecond ticks"
    referenced_by:
      - docs/architecture/adr-0002-skill-runtime-data-contract.md
    added: 2026-11-06
    revised: ""

