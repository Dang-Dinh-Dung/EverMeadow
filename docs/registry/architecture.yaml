# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: skill-moveset
    status: active
    budget_ms: 0.005
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    notes: "SkillLibrary.Select p99 <= 5 us (ADVISORY); 0 B allocation while a skill runs (600 steps, BLOCKING); full data set (~300 files) cold load <= 150 ms (ADVISORY)"
    referenced_by:
      - docs/architecture/adr-0002-skill-runtime-data-contract.md
    added: 2026-11-06
    revised: ""

