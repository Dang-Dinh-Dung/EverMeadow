# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: frame_time
    status: active
    pattern: direct_call
    producer: frame-clock
    consumers:
      - input
      - character-controller
      - combat
    adr: docs/architecture/adr-0001-input-architecture.md
    signal_signature: "IFrameClock: long RealNow, ScaledNow, RealDelta, ScaledDelta (1 tick = 1 us); double Scale (min of active scales)"
    referenced_by:
      - docs/architecture/adr-0001-input-architecture.md
      - docs/architecture/adr-0002-skill-runtime-data-contract.md
    added: 2026-10-31
    revised: ""
  - contract: buffered_input
    status: active
    pattern: direct_call
    producer: input
    consumers:
      - character-controller
      - interaction-context-prompts
      - menu-navigation
      - fishing
    adr: docs/architecture/adr-0001-input-architecture.md
    signal_signature: "IInputQueries: TryConsume/Peek(InputActionId, windowTicks, ClockKind Real|Scaled, out InputRecord), WasReleasedAfter(action, seq), IsHeld, ReadMove, ReadNavigate, RegisterConsumer"
    referenced_by:
      - docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
    revised: ""
  - contract: skill_definition
    status: active
    pattern: direct_call
    producer: skill-moveset
    consumers:
      - character-controller
      - combat
      - weapon-tree
      - skill-stone
      - loadout
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    signal_signature: "SkillDef (Common[]/Tap[]/Charged[] events, unscaled seconds) + SkillTime.StepsOf/TickOfStep; Controller copies timeline x timeline_scale into a preallocated SkillRun at StartSkill; external data enters validation only through ExternalCatalogs (HitProfiles, AnimKeys, CueIds, SpawnIds, ScaleBands)"
    referenced_by:
      - docs/architecture/adr-0002-skill-runtime-data-contract.md
      - docs/architecture/adr-0003-skill-authoring-pipeline.md
    added: 2026-11-06
    revised: ""

