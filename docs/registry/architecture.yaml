# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_device_read_in_gameplay
    status: active
    description: "Gameplay code must not read Keyboard.current, Gamepad.current, Mouse.current, UnityEngine.Input or InputAction directly; only IInputQueries / IInputModes / IInputDevices."
    why: "Bypasses the buffer, mode barrier and rebinding; breaks GDD Input binding tests 1-3."
    adr: docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
  - pattern: time_scale_write_outside_frame_driver
    status: active
    description: "No system other than FrameDriver writes Time.timeScale; speed changes go through ITimeScaleControl."
    why: "Two writers desync FrameClock and engine time; leaked hit-stop could lock the game slowed."
    adr: docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
  - pattern: player_input_or_project_wide_actions
    status: active
    description: "Do not use the PlayerInput component, InputSystem.actions (project-wide actions) or the template InputSystem_Actions.inputactions."
    why: "Global state breaks TD-C with domain reload off; auto scheme switching conflicts with GDD Input Rule 3/13."
    adr: docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
  - pattern: static_mutable_singleton
    status: active
    description: "No static singletons or static mutable state for registries or services; the composition root injects instances and Dispose unregisters everything."
    why: "Enter Play Mode with domain reload disabled keeps stale static state between plays (TD-C); untestable in isolation."
    adr: docs/architecture/adr-0001-input-architecture.md
    added: 2026-10-31
  - pattern: skill_tool_types_in_runtime_assembly
    status: active
    description: "No UnityEditor or GraphView type in a player assembly: the Skill Tool lives only in an Editor-only assembly, and only the XML in Assets/StreamingAssets/Skills/ reaches the build."
    why: "The authoring tool must never ship or be needed at run time; replacing it must not touch the game."
    adr: docs/architecture/adr-0003-skill-authoring-pipeline.md
    added: 2026-11-06
  - pattern: core_skills_references_combat_or_weapon_tree
    status: active
    description: "Evermeadow.Core.Skills references only Foundation.Common and Foundation.Time; Combat, Weapon Tree and other external data enter the validator as injected ExternalCatalogs."
    why: "Combat depends on the Controller, which depends on Core.Skills: a reference back would create a cycle."
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    added: 2026-11-06
  - pattern: skill_xml_parse_or_file_read_after_boot
    status: active
    description: "Skill XML is parsed and files are read only at load; StartSkill, Select and timeline execution must not parse, read files or allocate."
    why: "GDD AC-P01/P05: 0 B allocation and no file access while a skill runs."
    adr: docs/architecture/adr-0002-skill-runtime-data-contract.md
    added: 2026-11-06
  - pattern: hand_edit_generated_skill_xml
    status: active
    description: "Skill XML is created and edited through the Skill Tool, not by hand; a hand-edited body breaks payload_hash (PayloadHashMismatch: warning when loading in the Editor, build failure in the build check)."
    why: "One deterministic writer keeps diffs clean and the format exact (GDD Rule 2, 31; user decision 2026-11-06: XML is the only source)."
    adr: docs/architecture/adr-0003-skill-authoring-pipeline.md
    added: 2026-11-06

